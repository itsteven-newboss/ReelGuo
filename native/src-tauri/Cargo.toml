[package]
name = "reelguo"
version = "0.6.0"
description = "ReelGuo desktop and Android app: a native shell around the ReelGuo web app"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# staticlib/cdylib for Android, rlib for the desktop binary.
name = "reelguo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
# HTTPS with rustls on the ring backend (as the updater plugin uses) and Mozilla's root certificates, so it behaves
# the same on every platform and needs no Android JNI set-up for the system verifier.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
