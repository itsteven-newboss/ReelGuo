name: Native apps

# Builds the desktop installers (signed for the in-app updater) and the Android APK, and uploads them as artifacts.
# Runs on demand and for app-v* tags. Publishing a build to viewers stays a human step: upload the files to the
# download host, then add the release in Admin → App 版本 (docs/RUNBOOK.md §9).
#
# Needs, in the repository settings (Settings → Secrets and variables → Actions); each job checks them first and
# names any that are missing:
#   variable REELGUO_ORIGINS               the app's server addresses, comma-separated, preferred first
#   secrets  TAURI_SIGNING_PRIVATE_KEY     the updater signing key: the content of .tools/signing/reelguo-updater.key
#            TAURI_SIGNING_PRIVATE_KEY_PASSWORD   only when that key has a password
#            ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS   the APK signing key
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

env:
  REELGUO_ORIGINS: ${{ vars.REELGUO_ORIGINS }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            args: ""
          # One universal build serves both darwin-aarch64 and darwin-x86_64 releases.
          - os: macos-latest
            bundles: app,dmg
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            bundles: appimage
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Settings are in place
        shell: bash
        env:
          HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          missing=0
          need() { echo "::error::Missing $1 (Settings → Secrets and variables → Actions; docs/RUNBOOK.md §9)"; missing=1; }
          [ -n "$REELGUO_ORIGINS" ] || need "variable REELGUO_ORIGINS"
          [ "$HAS_UPDATER_KEY" = true ] || need "secret TAURI_SIGNING_PRIVATE_KEY"
          exit $missing
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Shell unit tests
        working-directory: native/src-tauri
        run: cargo test --lib
      - name: Build
        working-directory: native
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            native/src-tauri/target/**/release/bundle/nsis/*.exe
            native/src-tauri/target/**/release/bundle/nsis/*.sig
            native/src-tauri/target/**/release/bundle/macos/*.tar.gz
            native/src-tauri/target/**/release/bundle/macos/*.sig
            native/src-tauri/target/**/release/bundle/dmg/*.dmg
            native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            native/src-tauri/target/**/release/bundle/appimage/*.sig

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings are in place
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
        run: |
          missing=0
          need() { echo "::error::Missing $1 (Settings → Secrets and variables → Actions; docs/RUNBOOK.md §9)"; missing=1; }
          [ -n "$REELGUO_ORIGINS" ] || need "variable REELGUO_ORIGINS"
          [ "$HAS_KEYSTORE" = true ] || need "secret ANDROID_KEYSTORE_BASE64"
          [ "$HAS_PASSWORD" = true ] || need "secret ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_ALIAS" = true ] || need "secret ANDROID_KEY_ALIAS"
          exit $missing
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # A wrong keystore, password or alias would otherwise only show after the 15-minute build.
      - name: Signing key opens
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/check.jks"
          ok=0
          keytool -list -keystore "$RUNNER_TEMP/check.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null || ok=1
          rm "$RUNNER_TEMP/check.jks"
          [ $ok = 0 ] || { echo "::error::The Android keystore doesn't open with ANDROID_KEYSTORE_PASSWORD, or has no key named ANDROID_KEY_ALIAS"; exit 1; }
      # v4: v3 also installs the old "tools" package, which Google no longer serves ("Failed to find package 'tools'").
      - uses: android-actions/setup-android@v4
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # The Android project needs no hand edits (wry already allows autoplay and fullscreen video), so it is
      # generated fresh for every build.
      - name: Generate the Android project
        working-directory: native
        run: |
          pnpm tauri android init --ci
          pnpm tauri icon app-icon.json
      - name: Build APK
        working-directory: native
        run: pnpm tauri android build --apk --target aarch64 armv7 x86_64
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          VERSION=$(node -p "require('./native/src-tauri/tauri.conf.json').version")
          APK=$(ls native/src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --out "ReelGuo_${VERSION}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "ReelGuo_${VERSION}.apk"
          sha256sum "ReelGuo_${VERSION}.apk" | tee "ReelGuo_${VERSION}.apk.sha256"
          rm "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            ReelGuo_*.apk
            ReelGuo_*.apk.sha256
